name: Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Windows (GD 2.209)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the Geode CLI
        uses: geode-sdk/cli/.github/actions/setup@main

      - name: Set up a Geode profile
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'gd'
          New-Item -ItemType Directory -Force $dir | Out-Null
          New-Item -ItemType File -Force (Join-Path $dir 'GeometryDash.exe') | Out-Null
          geode profile add --name GithubActions (Join-Path $dir 'GeometryDash.exe') win

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Build the package
        id: build
        shell: pwsh
        env:
          GDSOLVER_BINDINGS_REPO: ${{ vars.GDSOLVER_BINDINGS_REPO }}
          GDSOLVER_BINDINGS_REF: ${{ vars.GDSOLVER_BINDINGS_REF }}
        run: ./scripts/ci-build-2209.ps1 -Work "$env:RUNNER_TEMP/ci-work" -Out "$env:GITHUB_WORKSPACE/output"

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: geode-package
          path: output

      - name: Attach it to the release
        if: github.event_name == 'release' && !github.event.release.prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" output/*.geode --clobber

  android:
    name: Android64 (GD 2.2081)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        id: build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3
          configure-args: -DGDSOLVER_BUILD_DP=OFF -DCMAKE_CXX_FLAGS=-ferror-limit=0

      - name: List every compile error
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          cmake --build build -- -k 0 > build-errors.log 2>&1
          status=$?
          echo "=== distinct errors (count, place, message) ==="
          grep -E "error:" build-errors.log | sed -E "s#${GITHUB_WORKSPACE}/##" \
            | sort | uniq -c | sort -rn
          echo "=== translation units that failed ==="
          grep -E "^FAILED:" build-errors.log | sed -E 's#.* -c ##; s#'"${GITHUB_WORKSPACE}"'/##' | sort -u
          exit $status

      - name: Upload the package
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: geode-package-android64
          path: ${{ steps.build.outputs.build-output }}
