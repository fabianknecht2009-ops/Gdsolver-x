
name: Prepare GD Solver source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -q gdsolver-main.zip -d /tmp/gdsx
          cp -a /tmp/gdsx/gdsolver-main/. .
          rm gdsolver-main.zip

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare GD Solver source"
          git push

